# Usage: docker compose --env-file .env.local up --build
services:
  api:
    build:
      context: ./backend/springboot
    image: capitec-api
    ports:
      - '${API_PORT:-8081}:8081'
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:?set VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAP_ID: ${VITE_GOOGLE_MAP_ID:-DEMO_MAP_ID}
    image: capitec-app
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
