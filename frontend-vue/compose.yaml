services:
  api:
    build:
      context: ../backend/springboot
    image: capitec-api
    ports:
      - '${API_PORT:-8083}:8081'
    restart: unless-stopped

  vue:
    build:
      context: .
    image: capitec-vue
    ports:
      - '${VUE_PORT:-8082}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
