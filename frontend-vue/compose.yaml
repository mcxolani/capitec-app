services:
  api:
    build:
      context: ../backend/dotnet
    image: capitec-dotnet-api
    ports:
      - '${DOTNET_API_PORT:-8084}:8081'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped

  vue:
    build:
      context: .
    image: capitec-vue
    ports:
      - '${VUE_PORT:-8082}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
