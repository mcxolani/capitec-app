name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-vue/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ci-placeholder
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/dotnet/Capitec.Api/Capitec.Api.csproj --configuration Release
      - run: npm ci --prefix frontend-vue
      - run: npm run lint --prefix frontend-vue
      - run: npm run typecheck --prefix frontend-vue
      - run: npm run build --prefix frontend-vue

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_GOOGLE_MAPS_API_KEY=ci-placeholder -t capitec-app .
      - run: docker build -t capitec-api ./backend/springboot
      - run: docker build -t capitec-vue ./frontend-vue
      - run: docker build -f backend/dotnet/Dockerfile -t capitec-dotnet-api backend/dotnet
      - run: docker compose config --quiet
        env:
          VITE_GOOGLE_MAPS_API_KEY: ci-placeholder
      - run: docker compose -f frontend-vue/compose.yaml config --quiet
      - run: docker compose -f backend/dotnet/compose.yaml config --quiet
